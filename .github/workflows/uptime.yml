name: Uptime

# Every 6 hours: checks that the live site answers, and keeps the free
# Supabase project awake (it pauses after 7 days without use). The warm-up
# and recipe-sitemap requests both reach the database. A failed run emails
# the repository owner (GitHub's default notification for workflow failures).
# GitHub turns scheduled workflows off after 60 days without repo activity;
# re-enable it under Actions if that happens.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://scent-handbook-app.vercel.app
    steps:
      - name: Live pages, database and function list
        run: |
          fail=0
          expect() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 --retry-delay 10 "$SITE$2")
            if [ "$code" = "$1" ]; then echo "ok   $code $2"; else echo "FAIL $code $2 (expected $1)"; fail=1; fi
          }
          expect 200 /
          expect 200 /ar
          expect 200 /pricing
          expect 200 /library/the-calculation
          expect 301 /guides/the-calculation
          expect 204 "/api/search?warm=1"
          expect 200 /sitemap-recipes.xml
          expect 404 /api/imports.test
          exit $fail
